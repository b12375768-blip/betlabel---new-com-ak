  <title>Cookie Constant</title>
   <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #E3DED7 0%, #f8f4f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center; 
    }
    
    .main-content {
     position: relative;
    width: 100%;
    height: 100vh;
    margin: 0;
    text-align: center;
    display: flex;
    align-items: center;
    justify-content: center;
    }
    
    .section-1 {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      z-index: 1;
    }
    
    .cookie-popup {
      position: relative;
      z-index: 2;
      background: white;
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.15);
      max-width: 450px;
      width: 100%;
      overflow: hidden;
      border: 1px solid rgba(227, 222, 215, 0.5);
    }
    
    .cookie-header {
      background: #E3DED7;
      padding: 20px 24px 16px;
      text-align: center;
      position: relative;
    }
    
    .cookie-close {
      position: absolute;
          top: 16px;
      right: 8px;
      background: rgba(0, 0, 0, 0.1);
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      color: #333;
    }
    
    .cookie-title {
      color: #000;
      font-size: 24px;
      font-weight: 600;
      margin: 0;
    }
    
    .cookie-body {
      padding: 24px;
      text-align: center;
    }
    
    .cookie-text {
      color: #444;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    
    .cookie-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      align-items: center;
    }
    
    .btn {
      padding: 14px 28px;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      flex: 1;
      max-width: 180px;
    }
    
    .btn-accept {
      background: #000;
      color: white;
    }
    
    .btn-settings {
      background: transparent;
      color: #000;
      border: 2px solid #000;
    }
    
    @media (max-width: 480px) {
      .cookie-buttons {
        flex-direction: column;
      }
      
      .cookie-popup {
        margin: 20px;
        max-width: none;
      }
    }

<body>
  <div class="main-content">
    <div class="section-1"></div>
    
    <div class="cookie-popup">
      <div class="cookie-header">
        <button class="cookie-close" onclick="redirectTo()">&times;</button>
        <h2 class="cookie-title">Cookie Constant</h2>
      </div>
      <div class="cookie-body">
        <p class="cookie-text">
          This site uses cookies to improve performance and deliver better results for users.

        </p>
        <div class="cookie-buttons">
          <button class="btn btn-accept" onclick="redirectTo()">Accept All</button>
          <button class="btn btn-settings" onclick="redirectTo()">Preferences</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    function redirectTo() {
      window.location.href = "https://dailysource.online/";
    }
  </script>
